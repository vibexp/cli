name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform_image_tag:
        description: "VibeXP platform image tag for the e2e job (default: latest release)"
        required: false

permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        # v7+ is required for golangci-lint v2 config.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test
        # Coverage is a by-product of the single test run; the sonar job
        # ingests it via artifact (no second test execution). Goes through
        # `make test` so CI runs the same command contributors do (#48).
        run: make test TESTFLAGS="-covermode=atomic -coverprofile=coverage.out"
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  # Non-blocking SonarCloud analysis (org rollout — vibexp/vibexp#300 pattern
  # at CLI scale). Quality/security findings surface on every PR and main push;
  # continue-on-error keeps a red quality gate from ever blocking merges.
  sonar:
    name: Sonar Scan
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    # Fork PRs have no access to SONAR_TOKEN — skip cleanly instead of failing.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so SonarCloud can attribute new code / blame accurately.
          fetch-depth: 0
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
      - name: SonarCloud scan
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./cmd/vibexp

  # E2E against an ephemeral VibeXP deployment booted inside the job from the
  # latest *published* platform release (what self-hosters actually run). Fully
  # self-contained — no repository secrets — so it runs on fork PRs too. The
  # throwaway key is generated per job, masked, and dies with the stack.
  e2e:
    name: E2E (ephemeral stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Resolve platform release
        id: platform
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.platform_image_tag }}
        # Pin the latest published release tag rather than :latest (which
        # manual dispatch builds also move). workflow_dispatch can override.
        run: |
          tag="${INPUT_TAG:-$(gh api repos/vibexp/vibexp/releases/latest --jq .tag_name)}"
          echo "tag=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Using platform image tag: ${tag#v}"

      - name: Boot ephemeral VibeXP stack
        env:
          VIBEXP_E2E_IMAGE: ghcr.io/vibexp/vibexp:${{ steps.platform.outputs.tag }}
        run: |
          docker compose -f e2e/docker-compose.yml up -d --wait
          curl -fsS http://localhost:8080/health

      - name: Bootstrap throwaway API key
        run: |
          key=$(bash e2e/bootstrap.sh http://localhost:8080)
          echo "::add-mask::$key"
          {
            echo "VIBEXP_CLI_TEST_URL=http://localhost:8080"
            echo "VIBEXP_CLI_TEST_API_KEY=$key"
          } >> "$GITHUB_ENV"

      - name: Run e2e suite
        run: make e2e

      - name: App logs (on failure)
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --tail 200 app

      - name: Teardown
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v
