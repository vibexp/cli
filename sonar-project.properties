# SonarCloud (SonarQube) scanner configuration for vibexp/cli.
#
# CI-based analysis (see the sonar job in .github/workflows/ci.yml), NOT
# SonarCloud Automatic Analysis: we ingest Go test coverage, which Automatic
# Analysis cannot do. The two modes are mutually exclusive — Automatic Analysis
# must stay OFF for this project in the SonarCloud UI or CI analysis is
# rejected (org rollout pattern: vibexp/vibexp#300).

sonar.organization=vibexp
sonar.projectKey=vibexp_cli

# --- Sources & tests ---
# Everything is a Go module rooted here; test.inclusions classifies *_test.go
# as tests so the rest is analyzed as main sources (a file is never indexed
# as both).
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# --- Coverage ---
# Produced by the CI test job (go test -coverprofile) and handed to the sonar
# job as an artifact.
sonar.go.coverage.reportPaths=coverage.out

# --- Exclusions ---
# Generated code is never analyzed; e2e/ drives the built binary against a
# live stack (build-tagged, not unit-testable code) so it is excluded from
# both the source and test scopes.
sonar.exclusions=**/*.gen.go,e2e/**
sonar.test.exclusions=e2e/**

# --- Rule tuning ---
# S5146 ("no redirects based on user-controlled data") fires on the mock
# authorization servers in the oauth tests, which redirect to the redirect_uri
# the client sent. That is not a flaw to fix — it is RFC 6749 §4.1.2 being
# simulated, and the whole point of those tests is to drive the real callback.
# Scoped to test sources so production redirects stay analyzed.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=gosecurity:S5146
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
